services:
  calc-api:
    build: .
    image: engineering-calc-api:latest
    container_name: engineering-calc-api
    ports:
      # 宿主机端口可用环境变量 HOST_PORT 覆盖（默认 8000），如 HOST_PORT=8080
      - "${HOST_PORT:-8000}:8000"
    environment:
      # 容器内监听地址/端口（通常无需修改）
      HOST: 0.0.0.0
      PORT: "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
